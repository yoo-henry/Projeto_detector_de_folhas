<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Folhas</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

    <!-- Biblioteca do Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#d9f7d6;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:420px;
            background:white;
            border-radius:15px;
            padding:25px;
            text-align:center;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        h1{
            color:#2e7d32;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin-bottom:20px;
        }

        button{
            background:#43a047;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            margin-bottom:20px;
        }

        button:hover{
            background:#2e7d32;
        }

        #webcam-container{
            margin:20px 0;
        }

        canvas{
            border:4px solid #4caf50;
            border-radius:10px;
        }

        #label-container{
            margin-top:20px;
            text-align:left;
        }

        #label-container div{
            background:#e8f5e9;
            padding:10px;
            margin:8px 0;
            border-left:5px solid #4caf50;
            border-radius:6px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🌿 Detector de Folhas</h1>

        <p>
            Clique no botão abaixo para iniciar a câmera e identificar a folha.
        </p>

        <button onclick="init()">
            📷 Iniciar Câmera
        </button>

        <div id="webcam-container"></div>

        <div id="label-container"></div>

    </div>

    <script>

        const URL = "./model/";

        let model;
        let webcam;
        let labelContainer;
        let maxPredictions;

        async function init() {

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true;
            webcam = new tmImage.Webcam(250, 250, flip);

            await webcam.setup();
            await webcam.play();

            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").innerHTML = "";
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";

            for(let i=0; i<maxPredictions; i++){
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop(){

            webcam.update();

            await predict();

            window.requestAnimationFrame(loop);
        }

        async function predict(){

            const prediction = await model.predict(webcam.canvas);

            for(let i=0; i<maxPredictions; i++){

                const porcentagem = (prediction[i].probability * 100).toFixed(1);

                labelContainer.childNodes[i].innerHTML =
                    `<strong>${prediction[i].className}</strong><br>${porcentagem}% de confiança`;

            }

        }

    </script>

</body>

</html>
